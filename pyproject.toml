[project]
name = "qbittorrent-smart-queues"
dynamic = ["version"]
description = "qBittorrent queue, quota, and health controller"
requires-python = ">=3.13"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Abhimanyu Saharan" }
]

[project.scripts]
qbittorrent-smart-queues = "qbittorrent_smart_queues.guard:main"
ryokan-import-reconciler = "qbittorrent_smart_queues.ryokan_reconciler:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "qbittorrent_smart_queues.__version__" }
