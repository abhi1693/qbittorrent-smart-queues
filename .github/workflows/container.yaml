name: Container
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Semver image version without a leading v
        required: true
permissions:
  contents: read
  packages: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  images:
    uses: abhi1693/actions/.github/workflows/container-images.yml@34e92ba1eee6a47e9b10f13e2180114fc01b6027
    with:
      manifest: .github/images.json
      publish: true
      version: ${{ inputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
