---
name: CI
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
    outputs:
      version:
        value: ${{ jobs.version.outputs.version }}
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source and release version parity
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/check_version.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install application
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests

  container:
    name: Native runtime image
    needs: [version, test]
    uses: abhi1693/actions/.github/workflows/container-images.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      manifest: .github/images.json
      publish: false
      version: ${{ needs.version.outputs.version }}
      changed-only: false
      scan: true
      scan-ignore-unfixed: false
      artifact-scope: ci-images
